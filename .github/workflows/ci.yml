name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Node 22 LTS — matches the runtime Vercel uses for serverless
          # functions and avoids the Node 20 deprecation warning on GHA.
          node-version: '22'
          cache: 'npm'

      # vercel.json no longer needs --legacy-peer-deps (v1.3.0); mirror that.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # E2E: boots the BUILT app in a real browser. The unit suite never mounts the
  # whole app, which is how a WebGL crash that blanked the entire page — and a
  # period where every serverless endpoint 500'd — both went unnoticed.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      # Chromium only — the suite does not need firefox/webkit.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # OSV scanner: cross-references our lockfile against the OSV vulnerability
  # DB. Runs in parallel with the main job and is non-blocking for now
  # (continue-on-error) so we can review findings before tightening.
  osv-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Run OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=./package-lock.json
            --format=table
