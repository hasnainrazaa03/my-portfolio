name: Lighthouse CI

# Lighthouse against the built site, on four routes: home, résumé, the fit
# tool and a case study. Assertions live in lighthouserc.json, not here.
#
# WHY THIS WAS REWRITTEN (2026-09-14)
# ──────────────────────────────────
# The previous version failed on every run it ever made, for three reasons:
#
#   1. Its thresholds were passed as CLI flags on top of the
#      `lighthouse:no-pwa` preset, and the flags never took. It documented
#      "performance warns below 0.85" and actually errored below 0.9 on every
#      audit the preset covers.
#   2. That preset asserts CPU-bound audits (main-thread work, max potential
#      FID) as errors. A shared CI runner scores 0 on those regardless of the
#      site, so the gate measured the runner.
#   3. It ran on pull requests only. Every real change here lands on main, so
#      the only code it ever tested was Dependabot's — and it failed all of
#      them. Eight dependency PRs then sat for a month, because a check that
#      is always red teaches everyone to ignore red.
#
# Now: deterministic categories (accessibility, best practices, SEO) gate;
# performance only warns, because runner CPU noise makes it a bad gate and
# production is measured separately. It runs on pushes to main too.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Same placeholder DSN as ci.yml, so the audited bundle matches production.
      - name: Build
        env:
          VITE_SENTRY_DSN: https://ci0000000000000000000000000000@o0.ingest.us.sentry.io/0
        run: npm run build

      - name: Run Lighthouse CI
        run: npx -y @lhci/cli@0.15.1 autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
