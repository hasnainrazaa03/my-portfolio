# Dependabot keeps npm + GitHub Action dependencies fresh.
# Conservative weekly cadence to avoid PR noise on a personal repo.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    groups:
      # Cluster related deps so one PR upgrades them together.
      react:
        patterns: ["react", "react-dom", "react-router-dom"]
      three:
        patterns: ["three", "@react-three/*"]
      testing:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "jsdom"]
      eslint:
        patterns: ["eslint", "eslint-*", "@eslint/*"]
    ignore:
      # ESLint 10 is blocked upstream: eslint-plugin-jsx-a11y (6.10.2, latest as
      # of 2026-09-14) declares a peer range that stops at ESLint 9. Taking the
      # bump means --legacy-peer-deps, which this repo removed deliberately.
      # Remove this rule once jsx-a11y ships ESLint 10 support:
      #   npm view eslint-plugin-jsx-a11y peerDependencies.eslint
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ci"
    commit-message:
      prefix: "chore(ci)"
